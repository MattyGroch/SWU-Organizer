# Card art cache (used by /card-art/ below). This file is included inside http {}, where
# proxy_cache_path must live. All art is ~2 GB at full size; `inactive` is long because
# art never changes, and nginx's default (10 minutes) would evict almost everything.
proxy_cache_path /var/cache/nginx/card-art levels=1:2 keys_zone=card_art:10m
  max_size=4g inactive=365d use_temp_path=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Behind Traefik, nginx's own scheme and port (http, :8080) are internal. Relative
  # redirects keep any redirect nginx does issue on the public https origin.
  absolute_redirect off;
  index index.html;

  # Card art proxy.
  #
  # cdn.swu-db.com is an S3 bucket that sends no Access-Control-Allow-Origin header, so the
  # browser blocks a cross-origin fetch() outright — and even if it did not, a canvas could
  # not read the pixels to downscale them. Serving the art same-origin is what makes the
  # image cache (downscale once, store in IndexedDB, work offline) possible at all.
  #
  # Mirrors the `/card-art` rule in vite.config.ts so dev and production behave alike.
  location /card-art/ {
    proxy_pass https://cdn.swu-db.com/images/cards/;
    proxy_set_header Host cdn.swu-db.com;
    proxy_ssl_server_name on;

    # Art for a given printing never changes, so cache hard at every layer: here on disk
    # (so a page new to the phone comes from this server, not swu-db), then in the browser,
    # which shrinks each image once and keeps it in IndexedDB.
    proxy_cache card_art;
    proxy_cache_valid 200 365d;
    # A missing picture (art not published yet) is rechecked soon rather than remembered.
    proxy_cache_valid 404 403 10m;
    # Upstream headers must not shorten or block that.
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    # A binder spread asks for 24 images at once: one upstream fetch per image, and keep
    # serving what is cached if swu-db is down.
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/snippets/security-headers.conf;

    # A missing image (e.g. a foil printing) must degrade to the text layout, not stall.
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_intercept_errors off;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Set catalogs and price overlays are refreshed on disk by the entrypoint, so they must
  # be revalidated rather than cached indefinitely.
  location /sets/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The web app manifest, with the type browsers expect (nginx's mime.types lacks it).
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The service worker must always be revalidated: a cached copy would pin every
  # installed app to an old deploy. (`/` below says the same; this keeps it explicit.)
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Single-page app: unknown paths are routes, not files. index.html is revalidated on
  # every load, so a deploy can never leave a browser holding a page whose hashed assets
  # are gone.
  location / {
    # No `$uri/`: the app serves no directory indexes, and a page route that happens to share
    # a name with a static folder (/scan vs the old /scan/ data folder) would otherwise be
    # redirected to that folder and answered with a 403.
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  gzip on;
  # application/octet-stream is the scan index (1.5 MB of fingerprints, ~1.2 MB gzipped).
  gzip_types text/css application/javascript application/json image/svg+xml
    application/manifest+json application/octet-stream;
  gzip_min_length 1024;
}
