server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Behind Traefik, nginx's own scheme and port (http, :8080) are internal. Relative
  # redirects keep any redirect nginx does issue on the public https origin.
  absolute_redirect off;
  index index.html;

  # Card art proxy.
  #
  # cdn.swu-db.com is an S3 bucket that sends no Access-Control-Allow-Origin header, so the
  # browser blocks a cross-origin fetch() outright — and even if it did not, a canvas could
  # not read the pixels to downscale them. Serving the art same-origin is what makes the
  # image cache (downscale once, store in IndexedDB, work offline) possible at all.
  #
  # Mirrors the `/card-art` rule in vite.config.ts so dev and production behave alike.
  location /card-art/ {
    proxy_pass https://cdn.swu-db.com/images/cards/;
    proxy_set_header Host cdn.swu-db.com;
    proxy_ssl_server_name on;

    # Art for a given printing never changes, so cache hard at every layer. Each image is
    # fetched once per browser and then lives in IndexedDB.
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/snippets/security-headers.conf;

    # A missing image (e.g. a foil printing) must degrade to the text layout, not stall.
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_intercept_errors off;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Set catalogs and price overlays are refreshed on disk by the entrypoint, so they must
  # be revalidated rather than cached indefinitely.
  location /sets/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Single-page app: unknown paths are routes, not files. index.html is revalidated on
  # every load, so a deploy can never leave a browser holding a page whose hashed assets
  # are gone.
  location / {
    # No `$uri/`: the app serves no directory indexes, and a page route that happens to share
    # a name with a static folder (/scan vs the old /scan/ data folder) would otherwise be
    # redirected to that folder and answered with a 403.
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
