# Security headers, included by every block in nginx.conf that sends headers.
#
# nginx does not merge add_header across levels: a location with its own add_header drops
# every server-level one. Including this snippet in each such block keeps them everywhere.
# `always` sends them on error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# The card scanner needs this site's own camera; nothing else gets it, and no microphone
# or location at all.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
