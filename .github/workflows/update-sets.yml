# .github/workflows/update-sets.yml
name: Update SWU set data

on:
  workflow_dispatch: {}         # allow manual run
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write               # needed to push a branch
  pull-requests: write          # needed to open the PR

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-sets        # never run two of these at the same time
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Discover main sets (writes scripts/sets.config.json)
        run: npm run discover:sets

      # The catalog as it stands, so the refresh can be checked against it.
      - name: Snapshot the committed catalog
        run: cp -r app/public/sets "$RUNNER_TEMP/previous-sets"

      - name: Build catalog (writes app/public/sets/*.json + manifest.json)
        run: npm run catalog:build

      # Fails the run if any card's base number (its binder slot) changed, which would
      # silently re-file owned cards into the wrong slots.
      - name: Validate catalog
        run: npm run catalog:validate
        env:
          SWU_REFERENCE_DIR: ${{ runner.temp }}/previous-sets

      # Prices are intentionally NOT fetched here — Docker refreshes *.prices.json
      # at container start and every 24h independent of git, so committing price
      # snapshots via this workflow was redundant and made it open PRs on price
      # drift alone, even when the card catalog hadn't changed.

      # Optional but keeps diffs tidy/consistent
      - name: Prettify JSON
        run: npx prettier -w "scripts/sets.config.json" "scripts/sets.discover-overrides.json"
        continue-on-error: true

      # Create a PR only if the card catalog actually changed
      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/update-sets
          base: main
          title: "chore(data): refresh SWU set data"
          commit-message: "chore(data): refresh SWU set data"
          body: |
            Automated refresh of the set catalog, manifest, and `scripts/sets.config.json`.
            - Sets list: `GET https://api.swu-db.com/sets` → `npm run discover:sets`
            - Catalog: `GET https://api.swu-db.com/cards/{setKey}` → `scripts/fetch-catalog.mjs`, gated by `scripts/validate-catalog.mjs` (no card may change binder slot)
            - Prices are not part of this workflow — Docker refreshes `*.prices.json` on start and every 24h without a new image build or PR.
          labels: data, automation
          add-paths: |
            app/public/sets/*.json
            app/public/sets/manifest.json
            scripts/sets.config.json
            scripts/sets.discover-overrides.json
          delete-branch: true
