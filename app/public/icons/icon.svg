    <rect x="168" y="310" width="52" height="74" rx="6"/>
    <rect x="230" y="310" width="52" height="74" rx="6"/>
    <rect x="292" y="310" width="52" height="74" rx="6"/>
  </g>
  <!-- The card you're looking for. -->
  <rect x="230" y="219" width="52" height="74" rx="6" fill="#8b5cf6"/>
