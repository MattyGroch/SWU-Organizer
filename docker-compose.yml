# SWU Organizer on one host behind Traefik: the app and the sync API (server/).
#
# The app runs the image CI publishes to Docker Hub on every merge to main; Watchtower
# pulls a new one within a day. To update now: `docker compose up -d swu-organizer`.
# The API is built here: `docker compose up -d --build swu-api`. See docs/deploy.md.

# A fixed project name: the stack keeps one identity whichever directory it is run from.
name: swu-organizer

services:
  swu-organizer:
    # SWU_APP_TAG (in .env) pins a published tag — v2.0.0, sha-6be7a7f — for a rollback.
    image: mattygroch/swu-organizer:${SWU_APP_TAG:-latest}
    # `up` always fetches the current tag, so `docker compose up -d swu-organizer` is the
    # manual "deploy now". (docker-compose.build.yml builds this checkout instead.)
    pull_policy: always
    container_name: swu-organizer
    restart: unless-stopped
    labels:
      # Watchtower keeps it on the newest published image, checking on its own schedule.
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.swu-organizer.entrypoints=websecure"
      - "traefik.http.routers.swu-organizer.rule=Host(`swu.mattyflix.com`)"
      - "traefik.http.routers.swu-organizer.priority=1"
      - "traefik.http.services.swu-organizer.loadbalancer.server.port=8080"
    networks:
      - proxy

  swu-api:
    build: ./server
    container_name: swu-api
    restart: unless-stopped
    environment:
      - DB_PATH=/config/swu.db
      - PORT=3001
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH_REDIRECT=${OAUTH_REDIRECT}
      - POST_LOGIN_REDIRECT=${POST_LOGIN_REDIRECT}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - COOKIE_SECURE=true
      - TRUST_PROXY=true
    volumes:
      - /var/config/swu-organizer:/config
    labels:
      # Built here, not published: there is nothing for Watchtower to pull.
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.routers.swu-api.entrypoints=websecure"
      - "traefik.http.routers.swu-api.rule=Host(`swu.mattyflix.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.swu-api.priority=100"
      - "traefik.http.services.swu-api.loadbalancer.server.port=3001"
    networks:
      - proxy

networks:
  proxy:
    external: true
