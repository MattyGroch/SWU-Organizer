# SWU Organizer on one host behind Traefik: the app (Dockerfile) and the sync API (server/).
# Deploy with `git pull && docker compose up -d --build` — see docs/deploy.md.

# A fixed project name: the stack keeps one identity whichever directory it is run from.
name: swu-organizer

services:
  swu-organizer:
    build: .
    container_name: swu-organizer
    restart: unless-stopped
    labels:
      # Both images are built on the host, so Watchtower has nothing to pull anyway; this
      # makes sure it never swaps in a Docker Hub image out of step with the API.
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.routers.swu-organizer.entrypoints=websecure"
      - "traefik.http.routers.swu-organizer.rule=Host(`swu.mattyflix.com`)"
      - "traefik.http.routers.swu-organizer.priority=1"
      - "traefik.http.services.swu-organizer.loadbalancer.server.port=8080"
    networks:
      - proxy

  swu-api:
    build: ./server
    container_name: swu-api
    restart: unless-stopped
    environment:
      - DB_PATH=/config/swu.db
      - PORT=3001
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH_REDIRECT=${OAUTH_REDIRECT}
      - POST_LOGIN_REDIRECT=${POST_LOGIN_REDIRECT}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS}
      - COOKIE_SECURE=true
      - TRUST_PROXY=true
    volumes:
      - /var/config/swu-organizer:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.routers.swu-api.entrypoints=websecure"
      - "traefik.http.routers.swu-api.rule=Host(`swu.mattyflix.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.swu-api.priority=100"
      - "traefik.http.services.swu-api.loadbalancer.server.port=3001"
    networks:
      - proxy

networks:
  proxy:
    external: true
